<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <h3>Login</h3>
                </div>
                <div class="card-body">
                    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                        <div class="form-group mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" formControlName="email">
                            <small class="text-danger" *ngIf="loginForm.get('email')?.touched &&
                loginForm.get('email')?.hasError('required')">
                                Email is required
                            </small>
                        </div>
                        <div class="form-group mb-3">
                            <label>Password</label>
                            <input type="password" class="form-control" formControlName="password">
                            <small class="text-danger" *ngIf="loginForm.get('password')?.touched &&
                loginForm.get('password')?.invalid">
                                Password is required
                            </small>
                        </div>
                        <p class="text-danger" *ngIf="errorMsg">
                            {{ errorMsg }}
                        </p>
                        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
                            Login
                        </button>
                        <p class="mt-3">
                            Don't have an account?
                            <a routerLink="/signup">Create Account</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
