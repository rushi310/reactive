<div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">
        <strong>Users ({{ users.length }})</strong>
        <button class="btn btn-primary btn-sm" (click)="onAddUser()">
            Add User
        </button>
    </div>

    <div class="list-group list-group-flush">

        <a *ngFor="let user of users" class="list-group-item list-group-item-action d-flex align-items-center"
            [routerLink]="['/users', user.id]" routerLinkActive="active">

            <img [src]="user.imageUrl" [alt]="user.name" class="avatar mr-3">

            <div>
                <div class="font-weight-bold">{{ user.name }}</div>
                <small>{{ user.role }}</small>
            </div>

        </a>

        <div *ngIf="users.length === 0" class="list-group-item text-center text-muted">
            No users found
        </div>

    </div>

</div>
